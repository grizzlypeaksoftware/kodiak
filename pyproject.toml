[project]
name = "kodiak-s1"
version = "0.0.1"
description = "Kodiak: an encoder-only 'System One' decision model. Typed questions in, calibrated answers out, one forward pass."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cortex Agent LLC" }, { name = "Shane Larson" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Dataset download/conversion and synthetic generation (Phase 2).
data = [
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "tokenizers>=0.20",
]

# Model training (Phase 3+). torch comes from the official CUDA 13 index (aarch64 wheels for the DGX Spark).
train = [
    "torch>=2.9",
    "safetensors>=0.4",
    "numpy>=1.26",
    "scipy>=1.11",  # Beta quantiles for score intervals
]

[project.urls]
Repository = "https://github.com/grizzlypeaksoftware/kodiak"

[dependency-groups]
baselines = [
    "gliclass>=0.1.20",
]
dev = [
    "pytest>=8",
    "transformers>=4.48",  # reference ModernBERT implementation for parity tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kodiak_s1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
