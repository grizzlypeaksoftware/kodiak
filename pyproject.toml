[project]
name = "kodiak-s1"
version = "0.0.1"
description = "Kodiak: an encoder-only 'System One' decision model. Typed questions in, calibrated answers out, one forward pass."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Cortex Agent LLC" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.urls]
Repository = "https://github.com/grizzlypeaksoftware/kodiak"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kodiak_s1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
